<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Gratitude</title>
  <style>
    :root {
      --color-background: #121212;
      --color-text: #e0e0e0;
      --color-surface-secondary: #2a2a2a;
      --color-accent: #73c2f0;
      --color-accent-active: #a8d9f5;
      --color-text-secondary: #c8c8c8;
      --color-surface: #1e1e1e;
      --color-border: #333;
      --color-text-placeholder: #555;
      --color-accent-hover: #8dcef3;
      --color-text-label: #777;
      --color-text-muted: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--color-background);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    .stepper {
      display: flex;
      gap: 8px;
      padding: 32px 16px 0;
    }

    .stepper .step {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-surface-secondary);
      transition: background 0.3s;
    }

    .stepper .step.done {
      background: var(--color-accent);
    }

    .stepper .step.active {
      background: var(--color-accent-active);
    }

    .container {
      flex: 1;
      flex-direction: column;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      width: 100%;
      max-width: 560px;
    }

    .card {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.3s ease;
    }

    .card.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question {
      font-size: 1rem;
      font-weight: normal;
      color: var(--color-text-muted);
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 112px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      color: var(--color-text);
      font-family: inherit;
      font-size: 16px;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--color-accent);
    }

    textarea::placeholder {
      color: var(--color-text-placeholder);
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:not([hidden]) {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn-primary {
      background: var(--color-accent);
      color: var(--color-background);
    }

    .btn-primary:hover {
      background: var(--color-accent-hover);
    }

    .btn-secondary {
      background: var(--color-surface-secondary);
      color: var(--color-text-secondary);
    }

    .btn-secondary:hover {
      background: var(--color-border);
    }

    /* Review page */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .review-item .review-label {
      font-size: 0.85rem;
      color: var(--color-text-label);
      margin-bottom: 6px;
    }

    .review-item .review-text {
      font-size: 1rem;
      color: var(--color-text-secondary);
      line-height: 1.5;
      background: var(--color-surface);
      border-radius: 8px;
      padding: 12px 16px;
      white-space: pre-wrap;
    }

    /* Done page */
    .done-message {
      font-size: 1rem;
      color: var(--color-text);
      line-height: 1.7;
    }

    .share-message-label {
      font-size: 0.85rem;
    }

    .share-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .share-panel textarea {
      min-height: 0;
    }

    .share-panel .actions {
      flex-wrap: wrap;
    }

    #share-status {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6" />
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6" />
    </symbol>
    <symbol id="icon-share" viewBox="0 0 24 24">
      <path d="m15 17 5-5-5-5" />
      <path d="M4 18v-2a4 4 0 0 1 4-4h12" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
    </symbol>
  </svg>

  <div class="stepper" id="stepper"></div>

  <div class="container">
    <!-- Question cards get built by JS -->
    <!-- Review card -->
    <div class="card" id="review">
      <div>Here's your gratitude for today</div>
      <div class="review-list" id="review-list"></div>
      <div class="actions">
        <button class="btn-secondary" onclick="goTo(4)"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg>Back</button>
        <button class="btn-primary" onclick="finish()">Done</button>
      </div>
    </div>

    <!-- Done card -->
    <div class="card" id="done">
      <p class="done-message">
        Nicely done.<br>
        No data was saved. The point is the exercise!<br>
        Come back tomorrow.
      </p>
      <div class="share-panel">
        <label class="question share-message-label" for="share-message">Let somebody know:</label>
        <textarea id="share-message">I did my daily gratitude today ✅</textarea>
        <div class="actions">
          <button id="share-button" class="btn-primary" onclick="shareCompletion()" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-share"></use></svg>Share</button>
          <button class="btn-secondary" onclick="copyCompletion()"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-copy"></use></svg>Copy</button>
        </div>
        <p id="share-status" role="status"></p>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      "Something beautiful or awesome from today",
      "I'm grateful for...",
      "A nice memory",
      "Something optimistic",
      "Grateful / proud that I..."
    ];

    const answers = Array(questions.length).fill("");
    let current = 0;

    const container = document.querySelector(".container");
    const stepper = document.getElementById("stepper");
    const reviewCard = document.getElementById("review");
    const doneCard = document.getElementById("done");
    const shareMessage = document.getElementById("share-message");
    const shareStatus = document.getElementById("share-status");
    document.getElementById("share-button").hidden = typeof navigator.share !== "function";

    // Build stepper dots
    questions.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "step";
      stepper.appendChild(dot);
    });
    // One more for review
    const reviewDot = document.createElement("div");
    reviewDot.className = "step";
    stepper.appendChild(reviewDot);

    // Build question cards
    questions.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "q" + i;
      card.innerHTML = `
        <div class="question">${q}</div>
        <textarea placeholder="Write here..." oninput="answers[${i}]=this.value"></textarea>
        <div class="actions">
          ${i > 0 ? `<button class="btn-secondary" onclick="goTo(${i - 1})"><svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-left"></use></svg>Back</button>` : ""}
          <button class="btn-primary" onclick="goTo(${i + 1})">Next<svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-chevron-right"></use></svg></button>
        </div>
      `;
      container.insertBefore(card, reviewCard);
    });

    function updateStepper() {
      const steps = stepper.querySelectorAll(".step");
      steps.forEach((s, i) => {
        s.className = "step";
        if (i < current) s.classList.add("done");
        if (i === current) s.classList.add("active");
      });
    }

    function goTo(index) {
      // Save current textarea value
      const currentTextarea = document.querySelector(".card.active textarea");
      if (currentTextarea && current < questions.length) {
        answers[current] = currentTextarea.value;
      }

      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));

      if (index < questions.length) {
        const card = document.getElementById("q" + index);
        card.classList.add("active");
        // Restore answer and focus
        const ta = card.querySelector("textarea");
        ta.value = answers[index];
        ta.focus({ preventScroll: true });
        stepper.style.display = "flex";
      } else if (index === questions.length) {
        showReview();
        stepper.style.display = "flex";
      }

      current = index;
      updateStepper();
      // Reset after rendering and focus, for both Next and Back navigation.
      window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    }

    function showReview() {
      const list = document.getElementById("review-list");
      list.innerHTML = "";
      questions.forEach((q, i) => {
        const item = document.createElement("div");
        item.className = "review-item";
        item.innerHTML = `
          <div class="review-label">${q}</div>
          <div class="review-text">${answers[i] || "—"}</div>
        `;
        list.appendChild(item);
      });
      reviewCard.classList.add("active");
    }

    function finish() {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      doneCard.classList.add("active");
      stepper.style.display = "none";
    }

    async function shareCompletion() {
      shareStatus.textContent = "";
      const text = shareMessage.value.trim();
      if (!text) {
        shareStatus.textContent = "Write a message first.";
        shareMessage.focus();
        return;
      }
      try {
        await navigator.share({ text });
      } catch (error) {
        if (error.name !== "AbortError") {
          shareStatus.textContent = "Couldn't open sharing. Try Copy message instead.";
        }
      }
    }

    async function copyCompletion() {
      shareStatus.textContent = "";
      const text = shareMessage.value.trim();
      if (!text) {
        shareStatus.textContent = "Write a message first.";
        shareMessage.focus();
        return;
      }
      try {
        await navigator.clipboard.writeText(text);
        shareStatus.textContent = "Message copied. Paste it into a text to your buddy.";
      } catch {
        shareMessage.focus();
        shareMessage.select();
        shareStatus.textContent = "Couldn't copy automatically. Copy the selected message and paste it into your text.";
      }
    }

    // Reset viewport scale when textarea loses focus (prevents iOS stuck-zoom)
    document.addEventListener("focusout", (e) => {
      if (e.target.tagName === "TEXTAREA") {
        const viewport = document.querySelector("meta[name=viewport]");
        viewport.setAttribute("content", "width=device-width, initial-scale=1.0");
      }
    });

    // Start
    goTo(0);
  </script>

</body>
</html>
