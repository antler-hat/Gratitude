<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Gratitude</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #121212;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    .stepper {
      display: flex;
      gap: 8px;
      padding: 32px 16px 0;
    }

    .stepper .step {
      width: 48px;
      height: 4px;
      border-radius: 2px;
      background: #2a2a2a;
      transition: background 0.3s;
    }

    .stepper .step.done {
      background: #73c2f0;
    }

    .stepper .step.active {
      background: #a8d9f5;
    }

    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      width: 100%;
      max-width: 560px;
    }

    .card {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 24px;
      animation: fadeIn 0.3s ease;
    }

    .card.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question {
      font-size: 1.25rem;
      font-weight: 500;
      color: #c8c8c8;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 16px;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #73c2f0;
    }

    textarea::placeholder {
      color: #555;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background: #73c2f0;
      color: #121212;
    }

    .btn-primary:hover {
      background: #8dcef3;
    }

    .btn-secondary {
      background: #2a2a2a;
      color: #c8c8c8;
    }

    .btn-secondary:hover {
      background: #333;
    }

    /* Review page */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .review-item .review-label {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 6px;
    }

    .review-item .review-text {
      font-size: 1rem;
      color: #c8c8c8;
      line-height: 1.5;
      background: #1e1e1e;
      border-radius: 8px;
      padding: 12px 16px;
      white-space: pre-wrap;
    }

    /* Done page */
    .done-message {
      text-align: center;
      font-size: 1.15rem;
      color: #999;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .container {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="stepper" id="stepper"></div>

  <div class="container">
    <!-- Question cards get built by JS -->
    <!-- Review card -->
    <div class="card" id="review">
      <div class="question">Here's your gratitude for today</div>
      <div class="review-list" id="review-list"></div>
      <div class="actions">
        <button class="btn-secondary" onclick="goTo(4)">&larr; Back</button>
        <button class="btn-primary" onclick="finish()">Done</button>
      </div>
    </div>

    <!-- Done card -->
    <div class="card" id="done">
      <p class="done-message">
        That's it. No data saved, nothing stored.<br>
        The gratitude was the point.<br><br>
        See you tomorrow.
      </p>
      <div class="actions" style="justify-content:center;">
        <button class="btn-secondary" onclick="restart()">Start over</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      "Something beautiful or awesome from today",
      "I'm grateful for...",
      "A nice memory",
      "Something optimistic",
      "Grateful / proud that I..."
    ];

    const answers = Array(questions.length).fill("");
    let current = 0;

    const container = document.querySelector(".container");
    const stepper = document.getElementById("stepper");
    const reviewCard = document.getElementById("review");
    const doneCard = document.getElementById("done");

    // Build stepper dots
    questions.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "step";
      stepper.appendChild(dot);
    });
    // One more for review
    const reviewDot = document.createElement("div");
    reviewDot.className = "step";
    stepper.appendChild(reviewDot);

    // Build question cards
    questions.forEach((q, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.id = "q" + i;
      card.innerHTML = `
        <div class="question">${q}</div>
        <textarea placeholder="Write here..." oninput="answers[${i}]=this.value"></textarea>
        <div class="actions">
          ${i > 0 ? `<button class="btn-secondary" onclick="goTo(${i - 1})">&larr; Back</button>` : ""}
          <button class="btn-primary" onclick="goTo(${i + 1})">Continue</button>
        </div>
      `;
      container.insertBefore(card, reviewCard);
    });

    function updateStepper() {
      const steps = stepper.querySelectorAll(".step");
      steps.forEach((s, i) => {
        s.className = "step";
        if (i < current) s.classList.add("done");
        if (i === current) s.classList.add("active");
      });
    }

    function goTo(index) {
      // Save current textarea value
      const currentTextarea = document.querySelector(".card.active textarea");
      if (currentTextarea) {
        answers[current] = currentTextarea.value;
      }

      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));

      if (index < questions.length) {
        const card = document.getElementById("q" + index);
        card.classList.add("active");
        // Restore answer and focus
        const ta = card.querySelector("textarea");
        ta.value = answers[index];
        ta.focus();
        stepper.style.display = "flex";
      } else if (index === questions.length) {
        showReview();
        stepper.style.display = "flex";
      }

      current = index;
      updateStepper();
    }

    function showReview() {
      const list = document.getElementById("review-list");
      list.innerHTML = "";
      questions.forEach((q, i) => {
        const item = document.createElement("div");
        item.className = "review-item";
        item.innerHTML = `
          <div class="review-label">${q}</div>
          <div class="review-text">${answers[i] || "—"}</div>
        `;
        list.appendChild(item);
      });
      reviewCard.classList.add("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    }

    function finish() {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      doneCard.classList.add("active");
      stepper.style.display = "none";
    }

    function restart() {
      answers.fill("");
      goTo(0);
    }

    // Reset viewport scale when textarea loses focus (prevents iOS stuck-zoom)
    document.addEventListener("focusout", (e) => {
      if (e.target.tagName === "TEXTAREA") {
        const viewport = document.querySelector("meta[name=viewport]");
        viewport.setAttribute("content", "width=device-width, initial-scale=1.0");
      }
    });

    // Start
    goTo(0);
  </script>

</body>
</html>
